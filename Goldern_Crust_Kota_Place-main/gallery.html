<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Golden Crust Kota Place</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Golden Crust Kota Place</h1>
        <p>Soweto's Best Kota Since 2018</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order Online</a>
            <a href="specials.html">Specials</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Golden Crust Gallery</h2>
            <p>Click on any image to view it in a larger Lightbox.</p>
        </section>

        <section class="gallery-container">
            <img src="images/crunchy-kota.jpg" onclick="openLightbox(this.src)" style="cursor:pointer;">
            <img src="images/combo-meal.jpeg" onclick="openLightbox(this.src)" style="cursor:pointer;">
            <img src="images/family-pack.jpg" onclick="openLightbox(this.src)" style="cursor:pointer;">
        </section>

        <div id="lightbox" class="lightbox">
            <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
            <img id="lightbox-img" src="">
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Golden Crust Kota Place. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT IS NOW INSIDE THE FILE -->
    <script>
        function openLightbox(imageSrc) {
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('lightbox-img').src = imageSrc;
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
