<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Golden Crust Kota Place</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Golden Crust Kota Place</h1>
        <p>Soweto's Best Kota Since 2018</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="menu.html">Menu</a>
            <a href="order.html">Order Online</a>
            <a href="specials.html">Specials</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Golden Crust Kota Place</h2>
            <p>Have a question? Get in touch with us.</p>
        </section>

        <section>
            <h3>Find Us</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14303.233477793495!2d27.9202321!3d-26.2376371!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e95a00000000000%3A0x0!2sOrlando%20West%2C%20Soweto!5e0!3m2!1sen!2sza!4v1620000000000!5m2!1sen!2sza" width="100%" height="300" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy"></iframe>
        </section>

        <section>
            <h3>Send Us a Message</h3>
            <form onsubmit="return validateForm(event)">
                <label>Full Name:</label>
                <input type="text" id="name">

                <label>Email Address:</label>
                <input type="email" id="email">

                <label>Message:</label>
                <textarea id="message" rows="5"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Golden Crust Kota Place. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT IS NOW INSIDE THE FILE -->
    <script>
        function validateForm(event) {
            event.preventDefault(); 
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if (name === "" || email === "" || message === "") {
                alert("Error: Please fill in all required fields.");
                return false;
            }
            if (!email.includes("@")) {
                alert("Error: Please enter a valid email address.");
                return false;
            }
            alert("Success! Your message has been sent.");
            event.target.reset(); 
            return true;
        }
    </script>
</body>
</html>
