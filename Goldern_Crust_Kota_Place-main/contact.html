            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>

        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Golden Crust Kota Place</h2>
            <p>Have a question? Get in touch with us.</p>
        </section>

        <section>
            <h3>Find Us</h3>
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14303.233477793495!2d27.9202321!3d-26.2376371!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e95a00000000000%3A0x0!2sOrlando%20West%2C%20Soweto!5e0!3m2!1sen!2sza!4v1620000000000!5m2!1sen!2sza" 
                width="100%" height="300" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy">
            </iframe>
        </section>

        <section>
            <h3>Send Us a Message</h3>
            <!-- THE FORM: Note the onsubmit="return validateForm(event)" -->
            <form onsubmit="return validateForm(event)">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email">

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
